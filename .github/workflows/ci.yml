name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: smoke test
        shell: bash
        run: |
          node dist/cli.js --version
          echo "hello world" | node dist/cli.js guard
          if echo "AKIAIOSFODNN7EXAMPLE" | node dist/cli.js guard; then
            echo "guard failed to block a secret" && exit 1
          fi
